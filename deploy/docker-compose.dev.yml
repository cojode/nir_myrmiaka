services:
  api:
    ports:
      # Exposes application port.
      - "8000:8000"
    build:
      context: .
    volumes:
      # Adds current directory as volume.
      - .:/app/src/
    environment:
      # Enables autoreload.
      NIR_MYRMIAKA_RELOAD: "True"
      # Set to 'true' and on the next launch alembic revisions would 
      # be autogenerated and applied based on current SA models
      AUTOGENERATE_REVISIONS: "true"
      # Set to 'true' and on the next launch pytest would be ran
      # On failed pytest application wont be launched 
      # RUN_TESTS: "false"