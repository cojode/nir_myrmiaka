services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: nir_myrmiaka:${NIR_MYRMIAKA_VERSION:-latest}
    env_file:
      - .env
    environment:
      NIR_MYRMIAKA_HOST: 0.0.0.0
      NIR_MYRMIAKA_DB_FILE: /db_data/db.sqlite3
    volumes:
      - nir_myrmiaka-db-data:/db_data/


  sqlite-web:
    image: kx1t/sqlite-web
    tty: true
    container_name: acarsdb
    restart: always
    ports:
      - 8080:8080
    environment:
      - SQLITE_DATABASE=/db_data/db.sqlite3
      - URL_PREFIX=/acarsdb
      - EXTRA_ARGS=-r
    volumes:
      - nir_myrmiaka-db-data:/db_data/

volumes:
  nir_myrmiaka-db-data:
    name: nir_myrmiaka-db-data
