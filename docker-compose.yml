services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: nir_myrmiaka:${NIR_MYRMIAKA_VERSION:-latest}
    env_file:
      - .env
    volumes:
      - nir_myrmiaka-db-data:/db_data/
    depends_on:
      - minio
    # Если вы хотите явно указать сеть (опционально)
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: nir-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

volumes:
  nir_myrmiaka-db-data:
    name: nir_myrmiaka-db-data
  minio-data:
    name: nir-minio-data

networks:
  app-network:
    driver: bridge